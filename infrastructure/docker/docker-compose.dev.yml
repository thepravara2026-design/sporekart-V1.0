version: '3.8'

services:
  sporekart-backend:
    build:
      context: ../../sporekart-backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=dev
    restart: unless-stopped

  sporekart-frontend:
    build:
      context: ../../sporekart-frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - sporekart-backend
    restart: unless-stopped
